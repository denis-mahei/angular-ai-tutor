<div class="flex flex-col justify-center items-center gap-4 p-6">

  @if (recipe()?.isFavorite) {
    <span class="text-3xl">⭐️</span>
  }
  <img [src]="recipe()?.imgUrl" [alt]="recipe()?.name" width="100" height="100">
  <p>email: {{recipe()?.authorEmail}}</p>
  <div>
    <p>Servings: {{ servings() }}</p>

    <table class="border-2 border-collapse border-b-zinc-200">
      <thead>
      <tr class="border-2">
        <th scope="col" class="border-r">Ingredients</th>
        <th scope="col" class="border-r p-2">Quantity</th>
        <th scope="col" class="p-2">Units</th>
      </tr>
      </thead>
      <tbody>
        @for (ingredients of adjustedIngredients(); track ingredients.name) {
          <tr class="**:p-2">
            <th scope="row" class="border-r text-sm font-light border-b">{{ ingredients.name }}</th>
            <td class="text-center text-sm font-light border-r border-b">
              {{ ingredients.quantity }}
            </td>
            <td class="text-center text-sm font-light border-b">{{ ingredients.unit }}</td>
          </tr>
        }
      </tbody>
    </table>

    <button type="button" class="mr-3" (click)="increase()">+</button>
    <button type="button" (click)="decrease()">-</button>
  </div>
</div>
