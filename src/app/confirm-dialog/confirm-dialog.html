<h2 mat-dialog-title>Delete recipe</h2>
<mat-dialog-content>
<p>Are you sure you want to delete the {{ data.name }}?</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button type="button" matButton mat-dialog-close>Cancel</button>
  <button type="button" matButton [mat-dialog-close]="true">Delete</button>
</mat-dialog-actions>
