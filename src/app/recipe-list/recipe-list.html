<div class="flex justify-center flex-col items-center">

  <mat-form-field>
    <input matInput
           [value]="searchTerm()"
           (input)="searchTerm.set($event.target.value)"
            type="text"
            placeholder="Search recipe..."
  />
  </mat-form-field>
  @for (recipe of searchRecipes(); track recipe.id) {
    <a class="underline text-3xl text-purple-300"
       [routerLink]="['/recipes', recipe.id]">{{ recipe.name }}</a>

  }

</div>
