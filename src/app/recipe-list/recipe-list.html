<div class="flex justify-center flex-col items-center">

  <mat-form-field>
    <mat-label>Search recipe...</mat-label>
    <input matInput
           type="text"
           [value]="recipeService.searchTerm()"
           (input)="recipeService.searchTerm.set($event.target.value)"
    />
  </mat-form-field>
  @if (recipeService.isLoading()) {
    <mat-spinner></mat-spinner>
  }
  <div class="grid grid-cols-3 gap-1">
    @for (recipe of recipeService.recipeValue(); track recipe.id) {
        <mat-card>
          <a class="underline text-3xl text-purple-300"
             [routerLink]="['/recipes', recipe.id]">
            <mat-card-header>
              {{ recipe.name }}
            </mat-card-header>
          </a>
          <mat-card-content>
            <img [src]="recipe.imgUrl" mat-card-image [alt]="recipe.name" width="100" height="100">
          </mat-card-content>
          <mat-card-actions align="end">
            <button type="button" matButton (click)="openDialog(recipe.id)">
              Remove
            </button>
          </mat-card-actions>
        </mat-card>

  }</div>
</div>
